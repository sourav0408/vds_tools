  $(document).ready(function () {
    $('#keyStoreIdentifier').on('change', function () {
      const keyStoreValue = $(this).val();
      const signingCertificateDropdown = $('#signingCertificate');



      signingCertificateDropdown.empty();
      signingCertificateDropdown.append('<option selected disabled>Choose Signing Certificate</option>');

      if (keyStoreValue) {
        fetch('http://localhost:5003/get-aliases2', {
          method: 'POST', // Change to POST
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ keyStore: keyStoreValue }) // Send keyStoreValue in the request body
        })
                .then(response => response.json())
                .then(data => {
                  console.log("Received Data: ", data);

                  if (data.aliases) {
                    data.aliases.forEach(alias => {
                      signingCertificateDropdown.append(
                              `<option value="${alias}">${alias}</option>`
                      );
                    });
                  } else {
                    console.error("No aliases found in response.");
                  }
                })
                .catch(error => {
                  console.error('Error fetching certificates:', error);
                  alert('Error fetching data from desktop app');
                });
      }
    });
  });

<script>
  const selectMenu = document.getElementById('keyStoreIdentifier');
  const popup = document.getElementById('popup');
  const selectedOption = document.getElementById('selectedOption');
  const passwordInput = document.getElementById('password');

  selectMenu.addEventListener('change', function() {
    if (this.value === 'DONGLE') {  // Only show the popup if "DONGLE" is selected
      // selectedOption.textContent = this.options[this.selectedIndex].text;
      popup.style.display = 'block';
    } else {
      popup.style.display = 'none';
    }
  });

  function submitPassword() {
    const password = passwordInput.value;
    if (password) {
      // Send the password to the Spring Boot backend
      fetch('http://localhost:8080/api/submitPassword2', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ password: password }) // Sending the password as JSON
      })
              .then(response => response.json())
              .then(data => {
                if (data.success) {
                  setPassword(password);
                  alert('Password is correct!');
                  const dongle = "DONGLE";
                  initializeKeyStoreDropdown(dongle);
                  popup.style.display = 'none';  // Close the popup after submission
                } else {
                  alert('Password is incorrect!');
                }
              })
              .catch(error => {
                console.error('Error:', error);
                alert('PassWord Mismatch');
              });
    } else {
      alert('Please enter a password!');
    }
  }

  // Close the popup if the user clicks outside of it
  window.addEventListener('click', function(event) {
    if (event.target === popup) {
      popup.style.display = 'none';
    }
  });
  ///for close popup
  function closePopup() {
    /*    const selectField = document.getElementById('signingCertificate');
        selectField.selectedIndex = -1;*/
    document.getElementById('popup').style.display = 'none';
  }

  // Function to populate the dropdown based on the keyStoreIdentifier
  function initializeKeyStoreDropdown(keyStoreValue) {
    const signingCertificateDropdown = $('#signingCertificate');

    // Clear the Signing Certificate dropdown

    signingCertificateDropdown.empty();
    signingCertificateDropdown.append('<option selected disabled>Choose Signing Certificate</option>');
    alert(`Check input box ${keyStoreValue}`);
    if (keyStoreValue) {
      $.ajax({
        url: `/api/certificates/${keyStoreValue}`, // Endpoint to fetch certificate options
        method: 'GET',
        success: function (data) {
          // Populate the dropdown with new options
          data.forEach(cert => {
            signingCertificateDropdown.append(
                    `<option value="${cert.certificateActualName}">${cert.alias}</option>`
            );
          });
        },
        error: function (err) {
          console.error('Error fetching certificates:', err);
        }
      });
    }
  }
  function setPassword(password)
  {
    const hiddenField = document.getElementById("passwordField");
    hiddenField.value = password;
  }
</script>
